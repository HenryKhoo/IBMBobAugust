<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar system CME simulator</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05070d; }
  #app { position: fixed; inset: 0; }
  #ui {
    position: fixed; top: 16px; left: 16px; width: 260px;
    background: rgba(10, 14, 24, 0.72); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    padding: 16px; color: #e8ecf4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #ui h1 { font-size: 14px; font-weight: 600; margin: 0 0 12px; letter-spacing: 0.2px; }
  #ui label { font-size: 12px; color: #9aa4b8; display: block; margin-bottom: 4px; }
  #ui .row { margin-bottom: 14px; }
  #ui input[type="range"] { width: 100%; }
  #ui .val { font-size: 12px; color: #e8ecf4; float: right; }
  #ui button {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
    background: linear-gradient(180deg, #3d5afe, #2c40c9); color: #fff; font-size: 13px;
    font-weight: 600; cursor: pointer;
  }
  #ui button:disabled { opacity: 0.6; cursor: default; }
  #status { font-size: 12px; color: #9aa4b8; margin-top: 10px; min-height: 16px; }
  #hint {
    position: fixed; bottom: 14px; left: 16px; font-size: 12px; color: #6c7690;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <h1>CME probe simulator</h1>
  <div class="row">
    <label>Probe speed <span class="val" id="speed-val">1400 km/s</span></label>
    <input type="range" id="speed" min="400" max="3000" step="50" value="1400">
  </div>
  <button id="launch">Launch probe to Earth</button>
  <div id="status">Idle on the solar surface.</div>
</div>
<div id="hint">Drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 130, 360);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(60, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 60;
controls.maxDistance = 900;

scene.add(new THREE.AmbientLight(0x334066, 0.6));

function starField() {
  const count = 2200;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 900 + Math.random() * 900;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.4, sizeAttenuation: false });
  scene.add(new THREE.Points(geo, mat));
}
starField();

const SUN_RADIUS = 11;
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(SUN_RADIUS, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0xffb347 })
);
scene.add(sun);

const sunGlow = new THREE.Mesh(
  new THREE.SphereGeometry(SUN_RADIUS * 1.35, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xff8c1a, transparent: true, opacity: 0.22 })
);
scene.add(sunGlow);

const sunLight = new THREE.PointLight(0xffddaa, 3.2, 0, 0);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

const ORBIT_RADIUS = 220;
const EARTH_RADIUS = 3.4;
const orbitCurve = new THREE.EllipseCurve(0, 0, ORBIT_RADIUS, ORBIT_RADIUS, 0, Math.PI * 2, false, 0);
const orbitPoints = orbitCurve.getPoints(128).map(p => new THREE.Vector3(p.x, 0, p.y));
const orbitLine = new THREE.LineLoop(
  new THREE.BufferGeometry().setFromPoints(orbitPoints),
  new THREE.LineBasicMaterial({ color: 0x2a3550, transparent: true, opacity: 0.6 })
);
scene.add(orbitLine);

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0x2f6fd6, roughness: 0.75, metalness: 0.1 })
);
scene.add(earth);
let earthAngle = 0;

function earthPosition(angle) {
  return new THREE.Vector3(Math.cos(angle) * ORBIT_RADIUS, 0, Math.sin(angle) * ORBIT_RADIUS);
}

function buildShip() {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd8dee9, roughness: 0.4, metalness: 0.5 });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0xff5a3c, roughness: 0.4, metalness: 0.3 });

  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2.4, 12), bodyMat);
  nose.rotation.z = -Math.PI / 2;
  nose.position.x = 2.4;
  group.add(nose);

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 3.6, 12), bodyMat);
  body.rotation.z = Math.PI / 2;
  group.add(body);

  const wingGeo = new THREE.BoxGeometry(1.4, 0.15, 2.6);
  const wingL = new THREE.Mesh(wingGeo, accentMat);
  wingL.position.set(-0.6, 0, 1.5);
  group.add(wingL);
  const wingR = new THREE.Mesh(wingGeo, accentMat);
  wingR.position.set(-0.6, 0, -1.5);
  group.add(wingR);

  const engine = new THREE.Mesh(
    new THREE.SphereGeometry(0.6, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xffcf7a })
  );
  engine.position.x = -2.1;
  group.add(engine);

  group.scale.setScalar(1.6);
  return group;
}

const ship = buildShip();
let shipStart = new THREE.Vector3();
let shipEnd = new THREE.Vector3();
let traveling = false;
let travelT = 0;
let travelDuration = 4000;
let travelStartTime = 0;

function resetShip() {
  const dir = new THREE.Vector3(1, 0, 0);
  shipStart = dir.clone().multiplyScalar(SUN_RADIUS * 1.5);
  ship.position.copy(shipStart);
  ship.lookAt(earthPosition(earthAngle));
}
scene.add(ship);
resetShip();

const speedSlider = document.getElementById('speed');
const speedVal = document.getElementById('speed-val');
const launchBtn = document.getElementById('launch');
const statusEl = document.getElementById('status');

speedSlider.addEventListener('input', () => {
  speedVal.textContent = speedSlider.value + ' km/s';
});

launchBtn.addEventListener('click', () => {
  if (traveling) return;
  const speed = parseInt(speedSlider.value, 10);
  const AU_KM = 149600000;
  const travelHours = Math.round(AU_KM / speed / 3600);
  travelDuration = Math.max(2500, Math.min(9000, travelHours * 55));

  shipStart = ship.position.clone();
  const ePosNow = earthPosition(earthAngle);
  shipEnd = ePosNow.clone().sub(ePosNow.clone().normalize().multiplyScalar(EARTH_RADIUS + 3));
  traveling = true;
  travelT = 0;
  travelStartTime = performance.now();
  launchBtn.disabled = true;
  statusEl.textContent = 'In transit · estimated ' + travelHours + 'h at ' + speed + ' km/s';
});

function animate(now) {
  requestAnimationFrame(animate);

  earthAngle += 0.0015;
  const ePos = earthPosition(earthAngle);
  earth.position.copy(ePos);
  earth.rotation.y += 0.01;
  sunGlow.rotation.y += 0.001;

  if (traveling) {
    const t = Math.min(1, (now - travelStartTime) / travelDuration);
    ship.position.lerpVectors(shipStart, shipEnd, t);
    ship.lookAt(ePos);
    if (t >= 1) {
      traveling = false;
      launchBtn.disabled = false;
      statusEl.textContent = 'Arrived at Earth. Ready to launch again.';
      setTimeout(() => {
        if (!traveling) {
          resetShip();
          statusEl.textContent = 'Idle on the solar surface.';
        }
      }, 1800);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
